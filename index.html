<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&display=swap');
:root{
  --creme:#F5F1DF; --preto:#181818; --dourado:#DBA538;
  --vermelho:#D93635; --pessego:#F4CDBC; --marrom:#68412B;
  --borda:4px solid var(--preto);
  --sombra:6px 6px 0 var(--preto);
  --sombra-hover:4px 4px 0 var(--preto);
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--creme);color:var(--preto);
  font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
  font-weight:700;line-height:1.3;min-height:100vh;min-height:100svh;
  padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;justify-content:center;
}
.hub{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:20px}

/* Cabeçalho */
.avatar{
  width:136px;height:136px;display:block;margin:0 auto;object-fit:cover;
  border:var(--borda);box-shadow:var(--sombra);background:var(--pessego);
}
.perfil{text-align:center}
h1{font-size:clamp(1.9rem,9vw,2.5rem);font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:-.02em}
.cargo{margin-top:10px;font-size:.95rem;text-transform:uppercase;font-weight:800;color:var(--marrom)}
.status{
  display:inline-block;background:var(--dourado);border:var(--borda);box-shadow:var(--sombra-hover);
  padding:8px 14px;font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.02em;text-align:center;
}

/* Botões */
.links{width:100%;display:flex;flex-direction:column;gap:18px;margin-top:4px}
.btn{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:64px;padding:14px 18px;
  color:var(--preto);text-decoration:none;text-transform:uppercase;
  font-size:1.1rem;font-weight:900;letter-spacing:.01em;
  border:var(--borda);box-shadow:var(--sombra);
  transition:transform .08s ease-out,box-shadow .08s ease-out;
  -webkit-tap-highlight-color:transparent;
}
.btn span:first-child{display:flex;align-items:center;gap:12px}
.btn svg{width:26px;height:26px;flex:none}
.seta{font-size:1.4rem;line-height:1}
.btn:hover,.card:hover{transform:translate(2px,2px);box-shadow:var(--sombra-hover)}
.btn:active,.card:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--preto)}
.btn:focus-visible{outline:4px solid var(--preto);outline-offset:4px}
.b-li{background:var(--pessego)}
.b-gh{background:var(--dourado)}
.b-pf{background:var(--vermelho)}
.b-ct{background:var(--creme)}

/* Mini-cards */
.grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{
  border:var(--borda);box-shadow:var(--sombra);padding:16px 14px;
  display:flex;flex-direction:column;gap:10px;
  transition:transform .08s ease-out,box-shadow .08s ease-out;
}
.card svg{width:30px;height:30px}
.card h2{font-size:.95rem;font-weight:900;text-transform:uppercase;line-height:1.15}
.card p{font-size:.8rem;font-weight:700;color:var(--marrom);line-height:1.35}
.c-qa{background:var(--pessego)}
.c-hw{background:var(--dourado)}
.c-hw p{color:var(--preto)}

/* Rodapé */
footer{display:flex;align-items:center;gap:10px;margin-top:6px;color:var(--marrom);font-size:.78rem;text-transform:uppercase;font-weight:800;text-align:center}
footer svg{width:28px;height:28px;flex:none}

@media (max-width:360px){
  .grid{grid-template-columns:1fr}
  .btn{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){.btn,.card{transition:none}}
</style>
